    <script src="script.js"></script>
    <script>
        // Gallery image data
        const galleryImages = [
            {
                src: 'Coach Adam 01.jpg',
                caption: 'Coach Adam brings calm, technical focus to pad work and close coaching.'
            },
            {
                src: 'Coach Adam 02.jpg',
                caption: 'One-to-one rounds help students sharpen timing, balance and clean striking habits.'
            },
            {
                src: 'Coach Nawaphon Chanmanee 01.jpg',
                caption: 'Nawaphon Chanmanee shares professional ring experience with students of all levels.'
            },
            {
                src: 'Coach Nawaphon Chanmanee 02.jpg',
                caption: 'Focused coaching sessions break down details that make technique sharper and safer.'
            },
            {
                src: 'Coach Nin 01.jpg',
                caption: 'Coach Nin works on the fundamentals that serious Muay Thai training is built on.'
            },
            {
                src: 'Coach Nin 02.jpg',
                caption: 'Hard rounds, simple corrections and steady repetition keep the training honest.'
            },
            {
                src: 'Coach Nin 03.jpg',
                caption: 'Conditioning and ring craft are trained together, not treated as separate work.'
            },
            {
                src: 'Coach Noi 01.jpg',
                caption: 'Coach Noi helps students build strong basics before adding speed and power.'
            },
            {
                src: 'Coach Noi 02.jpg',
                caption: 'Small technical adjustments can change how a punch, kick, knee or elbow lands.'
            },
            {
                src: 'Coach Susun 01.jpg',
                caption: 'Coach Susun brings energy and pressure to sessions built around real improvement.'
            },
            {
                src: 'Coach Susun 02.jpg',
                caption: 'Pad work at MJ Five Points is direct, practical and designed to expose bad habits.'
            },
            {
                src: 'Coach Susun 03.jpg',
                caption: 'Training here is not a resort activity. It is work, repetition and attention.'
            },
            {
                src: 'Master Jud with Buakaw.jpg',
                caption: 'Master Jud with Buakaw, reflecting the gym\'s connection to elite Muay Thai experience.'
            },
            {
                src: 'Master Jud.jpg',
                caption: 'Master Jud founded the gym around old-school standards, discipline and authentic coaching.'
            },
            {
                src: 'Master-Jud-3040879388.jpg',
                caption: 'Decades of coaching experience shape the atmosphere and expectations inside the gym.'
            },
            {
                src: 'Master-Jud-with-Buakaw.jpg',
                caption: 'A reminder of the level of Muay Thai knowledge behind the coaching team.'
            },
            {
                src: 'maxresdefault-1141276480.jpg',
                caption: 'The gym setting is simple and practical, with the focus kept on training.'
            },
            {
                src: 'media-3510629413.webp',
                caption: 'Students come here to improve their Muay Thai through consistent, guided work.'
            },
            {
                src: 'OIP-41752969.jpg',
                caption: 'Authentic training in Phuket for people who want more than a fitness holiday.'
            }
        ];

        let currentImageIndex = 0;

        // Load gallery
        function loadGallery() {
            const gallery = document.getElementById('gallery-grid');
            galleryImages.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `<img src="images/${img.src}" alt="Gallery image ${index + 1}" data-index="${index}" data-caption="${img.caption}">`;
                item.addEventListener('click', () => openLightbox(index));
                gallery.appendChild(item);
            });
        }

        function updateLightboxImage() {
            const imageData = galleryImages[currentImageIndex];
            const img = document.querySelector('.lightbox-image');
            const caption = document.getElementById('lightbox-caption');
            img.src = `images/${imageData.src}`;
            img.alt = imageData.caption;
            caption.textContent = imageData.caption;
        }

        // Lightbox functions
        function openLightbox(index) {
            currentImageIndex = index;
            const lightbox = document.getElementById('lightbox');
            updateLightboxImage();
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
            updateLightboxImage();
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
            updateLightboxImage();
        }

        // Event listeners
        document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
        document.querySelector('.lightbox-next').addEventListener('click', nextImage);
        document.querySelector('.lightbox-prev').addEventListener('click', prevImage);

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.style.display === 'flex') {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeLightbox();
            }
        });

        // Load gallery on page load
        window.addEventListener('load', loadGallery);
    </script>
</body>
</html>
