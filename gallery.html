<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav-container">
            <a href="index.html" class="logo">MJ Five Points Muay Thai</a>
            <div class="nav-right">
                <div class="language-selector">
                    <button class="lang-btn" id="lang-toggle" title="Select Language">EN</button>
                    <div class="lang-dropdown" id="lang-dropdown">
                        <button class="lang-option" data-lang="en">English</button>
                        <button class="lang-option" data-lang="th">ไทย (Thai)</button>
                        <button class="lang-option" data-lang="de">Deutsch</button>
                        <button class="lang-option" data-lang="fr">Français</button>
                        <button class="lang-option" data-lang="ar">العربية</button>
                        <button class="lang-option" data-lang="ru">Русский</button>
                        <button class="lang-option" data-lang="zh">中文</button>
                    </div>
                </div>
                <button class="hamburger" id="hamburger-toggle" title="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#packages">Training</a></li>
                <li><a href="coaches.html">Coaches</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="overseas.html">For Overseas</a></li>
                <li><a href="index.html#inquiry-form" class="cta-nav">Enquire</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section --> 
    <section class="gallery-hero">
        <div class="container">
            <h1>Gallery</h1>
            <p>Authentic Muay Thai training in action</p>
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <div class="container">
            <div class="gallery-grid" id="gallery-grid">
                <!-- Images will be loaded here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-image" src="" alt="">
        <div class="lightbox-nav">
            <button class="lightbox-prev">&#10094;</button>
            <button class="lightbox-next">&#10095;</button>
        </div>
    </div>

    <!-- Sticky WhatsApp Button (Mobile Only) -->
    <a href="https://wa.me/placeholder" class="sticky-whatsapp" target="_blank" title="Message us on WhatsApp">
        <span class="whatsapp-icon">💬</span>
    </a>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Master Jud Muay Thai Coaching. Authentic training in Phuket, Thailand.</p>
            <p>Contact: <a href="mailto:jsmithtid@outlook.com">jsmithtid@outlook.com</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Gallery image data
        const galleryImages = [
            'Coach Adam 01.jpg',
            'Coach Adam 02.jpg',
            'Coach Nawaphon Chanmanee 01.jpg',
            'Coach Nawaphon Chanmanee 02.jpg',
            'Coach Nin 01.jpg',
            'Coach Nin 02.jpg',
            'Coach Nin 03.jpg',
            'Coach Noi 01.jpg',
            'Coach Noi 02.jpg',
            'Coach Susun 01.jpg',
            'Coach Susun 02.jpg',
            'Coach Susun 03.jpg',
            'Master Jud with Buakaw.jpg',
            'Master Jud.jpg',
            'Master-Jud-3040879388.jpg',
            'Master-Jud-with-Buakaw.jpg',
            'maxresdefault-1141276480.jpg',
            'media-3510629413.webp',
            'OIP-41752969.jpg'
        ];

        let currentImageIndex = 0;

        // Load gallery
        function loadGallery() {
            const gallery = document.getElementById('gallery-grid');
            galleryImages.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `<img src="images/${img}" alt="Gallery image ${index + 1}" data-index="${index}">`;
                item.addEventListener('click', () => openLightbox(index));
                gallery.appendChild(item);
            });
        }

        // Lightbox functions
        function openLightbox(index) {
            currentImageIndex = index;
            const lightbox = document.getElementById('lightbox');
            const img = document.querySelector('.lightbox-image');
            img.src = `images/${galleryImages[index]}`;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
            document.querySelector('.lightbox-image').src = `images/${galleryImages[currentImageIndex]}`;
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
            document.querySelector('.lightbox-image').src = `images/${galleryImages[currentImageIndex]}`;
        }

        // Event listeners
        document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
        document.querySelector('.lightbox-next').addEventListener('click', nextImage);
        document.querySelector('.lightbox-prev').addEventListener('click', prevImage);

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.style.display === 'flex') {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeLightbox();
            }
        });

        // Load gallery on page load
        window.addEventListener('load', loadGallery);
    </script>
</body>
</html>
